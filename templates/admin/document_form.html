{% extends "admin/base_admin.html" %}
{% block title %}{{ action }} Document – Admin{% endblock %}
{% block page_title %}{{ action }} Document{% endblock %}
{% block content %}
<div class="card" style="max-width:450px;">
  <div class="card-header py-3">{{ action }} Document</div>
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-600">Document Name *</label>
        <input type="text" name="document_name" class="form-control" required value="{{ document.document_name if document else '' }}">
      </div>
      <div class="mb-4">
        <div class="form-check">
          <input type="checkbox" name="is_mandatory" id="is_mandatory" class="form-check-input"
            {% if not document or document.is_mandatory %}checked{% endif %}>
          <label class="form-check-label" for="is_mandatory">Mandatory Document</label>
        </div>
      </div>
      <div class="d-flex gap-2 justify-content-end">
        <a href="{{ url_for('admin_documents') }}" class="btn btn-secondary">Cancel</a>
        <button class="btn btn-primary">{{ action }}</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
