<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign in — Vehicle Import</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2314213D'/><text y='22' x='5' font-size='20' font-family='serif'>🚗</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;background:var(--c-bg);">

<div style="width:100%;max-width:400px;padding:1.5rem;">
  <div class="text-center mb-4">
    <a href="{{ url_for('index') }}" style="text-decoration:none;">
      <svg class="mb-2" width="36" height="36" fill="none" stroke="#14213D" stroke-width="2" viewBox="0 0 24 24"><rect x="1" y="8" width="22" height="12" rx="2"/><path d="M5 8V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v2"/><circle cx="7" cy="17" r="1.5"/><circle cx="17" cy="17" r="1.5"/></svg>
      <div style="font-size:1rem;font-weight:700;color:var(--c-navy);font-family:var(--font-sans);">Vehicle Import Eligibility</div>
    </a>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ 'danger' if cat=='danger' else 'warning' if cat=='warning' else 'info' }} alert-dismissible mb-3 flash-alert" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  <div class="app-card">
    <div class="app-card-header" style="background:var(--c-bg);">
      <h3 style="font-size:1rem;margin:0;">Admin sign in</h3>
    </div>
    <div class="app-card-body">
      <form method="POST" action="{{ url_for('admin_login') }}" autocomplete="on">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input type="text" name="username" id="username" class="form-control" required
                 autocomplete="username" autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <input type="password" name="password" id="password" class="form-control" required
                 autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign in</button>
      </form>
    </div>
  </div>

  <p class="text-center text-muted mt-3" style="font-size:.8125rem;">
    <a href="{{ url_for('index') }}">← Back to public site</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
