<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login – Carnet Import</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Inter',sans-serif; background:linear-gradient(135deg,#1a56db 0%,#0f172a 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .login-card { width:400px; border-radius:20px; border:none; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
    .form-control:focus { border-color:#1a56db; box-shadow:0 0 0 3px rgba(26,86,219,.15); }
    footer { position:fixed; bottom:0; left:0; right:0; text-align:center; color:rgba(255,255,255,.5); font-size:.78rem; padding:.8rem; }
  </style>
</head>
<body>
<div class="login-card card p-4">
  <div class="text-center mb-4">
    <div style="font-size:2.5rem;">🛡️</div>
    <h2 class="fw-800 mt-2">Admin Login</h2>
    <p class="text-muted small">Indian Vehicle Import System</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ 'danger' if cat=='danger' else 'info' }} py-2 border-0 rounded-3">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" action="{{ url_for('admin_login') }}">
    <div class="mb-3">
      <label class="form-label fw-600">Username</label>
      <input type="text" name="username" id="username" class="form-control form-control-lg" required autofocus placeholder="admin">
    </div>
    <div class="mb-4">
      <label class="form-label fw-600">Password</label>
      <input type="password" name="password" id="password" class="form-control form-control-lg" required placeholder="••••••••">
    </div>
    <div class="d-grid">
      <button type="submit" class="btn btn-primary btn-lg fw-600">
        <i class="bi bi-box-arrow-in-right me-2"></i>Login
      </button>
    </div>
  </form>
  <div class="text-center mt-3">
    <a href="{{ url_for('index') }}" class="text-muted small">← Back to Public Site</a>
  </div>
</div>
<footer>Educational project only. Verify current import requirements with official Indian authorities.</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
