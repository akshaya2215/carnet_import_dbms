{# templates/partials/topbar.html #}
<header class="pub-topbar" role="banner">
  <button class="menu-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="pubNav">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <a class="pub-topbar-brand" href="{{ url_for('index') }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="1" y="8" width="22" height="12" rx="2"/>
      <path d="M5 8V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v2"/>
      <circle cx="7" cy="17" r="1.5"/>
      <circle cx="17" cy="17" r="1.5"/>
    </svg>
    <span>Vehicle Import Eligibility</span>
  </a>

  <nav aria-label="Main navigation">
    <ul class="pub-nav" id="pubNav">
      <li>
        <a class="pub-nav-link {% if request.endpoint == 'check' %}active{% endif %}" href="{{ url_for('check') }}">
          Check eligibility
        </a>
      </li>
      <li>
        <a class="pub-nav-link {% if request.endpoint == 'rules' %}active{% endif %}" href="{{ url_for('rules') }}">
          Rules
        </a>
      </li>
      <li>
        <a class="pub-nav-link {% if request.endpoint == 'about' %}active{% endif %}" href="{{ url_for('about') }}">
          About
        </a>
      </li>
    </ul>
  </nav>

  <div class="pub-topbar-right">
    <a class="admin-link" href="{{ url_for('admin_login') }}">
      Admin sign in
    </a>
  </div>
</header>
